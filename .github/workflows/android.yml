name: Android build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.2 build-tools;36.0.0'
      - name: Verify release metadata and publication
        run: python3 -m unittest discover -s scripts/tests -v
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      - name: Verify SMS input fields and document boundaries
        run: |
          npm ci --prefix scripts
          npm run --prefix scripts test:sms
      - name: Verify pull requests and development builds
        if: github.ref != 'refs/heads/main' || github.event_name == 'pull_request'
        run: |
          bash scripts/build.sh debug
          ./gradlew :app:lintRelease :app:assembleRelease --console=plain
      - name: Restore release signing key
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          AIR_KEYSTORE_BASE64: ${{ secrets.AIR_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "$AIR_KEYSTORE_BASE64" ]]; then
            printf 'Configure AIR release signing secrets before distributing APKs.\n' >&2
            exit 1
          fi
          printf '%s' "$AIR_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/air-release.keystore"
      - name: Verify and build AIR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          AIR_KEYSTORE_PATH: ${{ runner.temp }}/air-release.keystore
          AIR_KEYSTORE_PASSWORD: ${{ secrets.AIR_KEYSTORE_PASSWORD }}
          AIR_KEY_ALIAS: ${{ secrets.AIR_KEY_ALIAS }}
          AIR_KEY_PASSWORD: ${{ secrets.AIR_KEY_PASSWORD }}
        run: |
          export AIR_VERSION_CODE="$((1000 + GITHUB_RUN_NUMBER))"
          bash scripts/build.sh release
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs artifacts/release/AIR.apk
          python3 scripts/release_manifest.py --apk artifacts/release/AIR.apk --aapt "$ANDROID_HOME/build-tools/36.0.0/aapt" --output artifacts/release/update.json
          printf 'AIR.apk · ARM64 · versionCode %s\n' "$AIR_VERSION_CODE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: AIR
          path: |
            artifacts/release/AIR.apk
            artifacts/release/SHA256SUMS
            artifacts/release/update.json
          if-no-files-found: error
      - name: Remove signing key
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: rm -f "$RUNNER_TEMP/air-release.keystore"
  publish:
    name: Publish AIR release
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: air-release-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: AIR
          path: artifacts/release
      - name: Publish APK and version manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_release.py
